<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ビーバー・ダム・ビルダーズ タイムアタック版</title>
    <!-- Firebaseの仕組みを読み込む（v10互換CDN） -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap');

        /* 画面全体のテキスト選択やカーソル・ハイライトを完全に禁止 */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a1a1a;
            color: #333;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            text-align: center;
            margin: 0;
            padding: 5px;
            overflow: hidden;
            touch-action: manipulation;
        }
        h2 {
            color: #fff;
            margin: 4px auto;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1px;
            max-width: 800px;
            line-height: 1.3;
        }
        .title-line {
            display: inline-block;
            white-space: nowrap;
        }
        .game-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        canvas {
            border: 3px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
            background-color: #87CEEB;
            image-rendering: pixelated;
            width: 100%;
            max-width: 800px;
            height: auto;
            cursor: default;
        }
        .mobile-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 6px auto 0 auto;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .d-pad {
            display: flex;
            gap: 12px;
        }
        .ctrl-btn {
            width: 75px;
            height: 60px;
            font-size: 24px;
            font-weight: bold;
            background-color: #333;
            color: #ffcc00;
            border: 3px solid #555;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: none;
            outline: none;
        }
        .ctrl-btn:active {
            background-color: #555;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.4);
        }
        .jump-pad {
            display: flex;
        }
        .jump-btn {
            width: 130px;
            height: 60px;
            font-size: 18px;
            white-space: nowrap;
            background-color: #ff5533;
            color: #fff;
            border: 3px solid #cc3311;
        }
        .jump-btn:active {
            background-color: #dd4422;
        }

        .info-area {
            max-width: 800px;
            margin: 6px auto 0 auto;
        }
        .info {
            font-size: 11px;
            background: #f0f0f0;
            color: #222;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 800;
        }
        .menu-btns {
            margin-top: 6px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .action-btn {
            padding: 8px 20px;
            font-size: 15px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 800;
            background-color: #ffcc00;
            color: #222;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            outline: none;
        }
        .action-btn:hover {
            background-color: #ffdd33;
        }
        .action-btn:disabled {
            background-color: #888;
            color: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
        #rankingModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 3px solid #ffcc00;
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            width: 320px;
            max-width: 90%;
            z-index: 100;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        #rankingModal h3 {
            margin-top: 0;
            color: #ffcc00;
            font-weight: 800;
        }
        #rankingList {
            text-align: left;
            font-size: 13px;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 12px;
            background: #2a2a2a;
            padding: 8px;
            border-radius: 6px;
            font-weight: 800;
        }
        .ranking-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            border-bottom: 1px solid #444;
            padding-bottom: 2px;
        }
        #nameInput {
            padding: 6px;
            font-size: 16px;
            width: 140px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin-right: 5px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 800;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>
    <h2>
        <span class="title-line">🦫 ビーバー・ダム・ビルダーズ</span><br>
        <span class="title-line">タイムアタック</span>
    </h2>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>
    
    <div class="mobile-controls">
        <div class="d-pad">
            <button class="ctrl-btn" id="leftBtn" onclick="onCommandAction('left')">◀</button>
            <button class="ctrl-btn" id="rightBtn" onclick="onCommandAction('right')">▶</button>
        </div>
        <div class="jump-pad">
            <button class="ctrl-btn jump-btn" id="jumpBtn" onclick="onCommandAction('jump')">▲ ジャンプ</button>
        </div>
    </div>

    <div class="info-area">
        <div class="info">
            ✨ 子どもたちが待ってるよ！キラキラ光る場所まで木材を運んで素敵なお家を作ろう！（丸太は最大4本まで）
        </div>
        <div class="menu-btns">
            <button class="action-btn" id="restartBtn" onclick="onCommandAction('restart'); restartGame();">🔄 リスタート</button>
            <button class="action-btn" id="rankingBtn" onclick="onCommandAction('ranking'); openRankingModal(false);">🏆 ランキング</button>
        </div>
    </div>

    <!-- ランキング＆名前登録モーダル -->
    <div id="rankingModal">
        <h3 id="modalTitle">🏆 タイムアタック ランキング</h3>
        <div id="resultMessage" style="display:none; background: #332200; border: 2px solid #ffcc00; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; color: #ffff66;"></div>
        
        <div id="nameEntryArea" style="margin-bottom: 10px; display:none;">
            <p style="font-size: 13px; margin: 4px 0;">お名前を入力してください:</p>
            <input type="text" id="nameInput" maxlength="10" placeholder="なまえ">
            <button class="action-btn" id="registerBtn" onclick="saveScore()" style="padding: 6px 16px; font-size: 14px;">登録</button>
        </div>
        <div id="rankingList"></div>
        <div style="display: flex; justify-content: center; margin-top: 10px;">
            <button class="action-btn" onclick="closeRankingModal()" style="padding: 6px 16px; font-size: 14px;">閉じる</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAMpoiTJ5IOJKQUmEkcHzcLlWgL7Y1rzIA",
            authDomain: "rank-38091.firebaseapp.com",
            projectId: "rank-38091",
            storageBucket: "rank-38091.firebasestorage.app",
            messagingSenderId: "32545426658",
            appId: "1:32545426658:web:119d705af97388863162bb",
            measurementId: "G-6RM0CQXDBL"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const secretSequence = ['restart', 'restart', 'left', 'right', 'left', 'right', 'jump', 'jump', 'ranking'];
        let currentInputSequence = [];
        let nightMode = false;
        let nightModeMsgTimer = 0;
        let secretClickCount = 0;

        function toggleNightMode() {
            nightMode = !nightMode;
            nightModeMsgTimer = 120;
            playHealSound();
        }

        function onCommandAction(action) {
            currentInputSequence.push(action);
            if (currentInputSequence.length > secretSequence.length) {
                currentInputSequence.shift();
            }

            let matched = true;
            for (let i = 0; i < currentInputSequence.length; i++) {
                if (currentInputSequence[i] !== secretSequence[i]) {
                    matched = false;
                    break;
                }
            }

            if (matched && currentInputSequence.length === secretSequence.length) {
                toggleNightMode();
                currentInputSequence = [];
            }
        }

        window.addEventListener("DOMContentLoaded", async () => {
            try {
                let ranking = await getCloudRanking();
                updateRankingDisplay(ranking);
            } catch (e) {
                console.error("初期ランキング読込エラー:", e);
            }
        });

        async function getCloudRanking() {
            try {
                let snapshot = await db.collection("rankings")
                    .orderBy("timeMs", "asc")
                    .limit(50)
                    .get();
                let ranking = [];
                snapshot.forEach(doc => {
                    ranking.push(doc.data());
                });
                return ranking;
            } catch (e) {
                console.error("ランキング取得エラー:", e);
                try {
                    let snapshot2 = await db.collection("rankings").get();
                    let ranking2 = [];
                    snapshot2.forEach(doc => ranking2.push(doc.data()));
                    ranking2.sort((a, b) => a.timeMs - b.timeMs);
                    return ranking2;
                } catch (err2) {
                    return [];
                }
            }
        }

        async function saveCloudScore(playerName, timeMs, timeStr) {
            let now = new Date();
            let dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            await db.collection("rankings").add({
                name: playerName,
                timeMs: timeMs,
                timeStr: timeStr,
                date: dateStr,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function updateRankingDisplay(ranking) {
            let listHtml = "";
            if (ranking.length === 0) {
                listHtml = "<div style='text-align:center; color:#888; padding: 10px;'>まだ記録がありません</div>";
            } else {
                ranking.forEach((r, index) => {
                    let rankNum = index + 1;
                    let nameDisplay = r.name;
                    let rowStyle = "";
                    
                    if (rankNum === 1) {
                        nameDisplay = "👑 " + r.name;
                        rowStyle = "color: #ffd700; font-weight: bold;";
                    }

                    listHtml += `<div class="ranking-row" style="${rowStyle}"><span>${rankNum}. ${nameDisplay}</span><span>${r.timeStr} <small style="color:#aaa; font-weight:normal;">(${r.date})</small></span></div>`;
                });
            }
            document.getElementById("rankingList").innerHTML = listHtml;
        }

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playStartSound() {
            initAudio();
            if (!audioCtx) return;

            let notes = [
                { f: 440.00, t: 0.0,  d: 0.08 },
                { f: 554.37, t: 0.07, d: 0.08 },
                { f: 659.25, t: 0.14, d: 0.08 },
                { f: 880.00, t: 0.21, d: 0.25 }
            ];

            notes.forEach(n => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(n.f, audioCtx.currentTime + n.t);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime + n.t);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + n.t + n.d);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + n.t);
                osc.stop(audioCtx.currentTime + n.t + n.d);
            });

            let oscSweep = audioCtx.createOscillator();
            let gainSweep = audioCtx.createGain();
            oscSweep.type = 'triangle';
            oscSweep.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.3);
            oscSweep.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.6);

            gainSweep.gain.setValueAtTime(0.15, audioCtx.currentTime + 0.3);
            gainSweep.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.65);

            oscSweep.connect(gainSweep);
            gainSweep.connect(audioCtx.destination);
            oscSweep.start(audioCtx.currentTime + 0.3);
            oscSweep.stop(audioCtx.currentTime + 0.65);
        }

        function playGameOverSound() {
            initAudio();
            if (!audioCtx) return;

            let dropNotes = [
                { f: 330.00, t: 0.0,  d: 0.18 },
                { f: 293.66, t: 0.15, d: 0.18 },
                { f: 261.63, t: 0.30, d: 0.18 },
                { f: 220.00, t: 0.45, d: 0.30 }
            ];

            dropNotes.forEach(n => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(n.f, audioCtx.currentTime + n.t);
                
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime + n.t);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + n.t + n.d);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + n.t);
                osc.stop(audioCtx.currentTime + n.t + n.d);
            });

            let oscBass = audioCtx.createOscillator();
            let gainBass = audioCtx.createGain();
            oscBass.type = 'sawtooth';
            oscBass.frequency.setValueAtTime(110.00, audioCtx.currentTime + 0.6);
            oscBass.frequency.linearRampToValueAtTime(55.00, audioCtx.currentTime + 1.2);

            gainBass.gain.setValueAtTime(0.22, audioCtx.currentTime + 0.6);
            gainBass.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);

            oscBass.connect(gainBass);
            gainBass.connect(audioCtx.destination);
            oscBass.start(audioCtx.currentTime + 0.6);
            oscBass.stop(audioCtx.currentTime + 1.4);
        }

        function playVictoryFanfare() {
            initAudio();
            if (!audioCtx) return;
            
            let notes = [
                { f: 523.25, t: 0.0,  d: 0.12 },
                { f: 659.25, t: 0.12, d: 0.12 },
                { f: 783.99, t: 0.24, d: 0.12 },
                { f: 1046.5, t: 0.36, d: 0.25 },
                { f: 880.00, t: 0.65, d: 0.12 },
                { f: 987.77, t: 0.77, d: 0.12 },
                { f: 1174.66, t: 0.92, d: 0.4 }
            ];

            notes.forEach(n => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(n.f, audioCtx.currentTime + n.t);
                
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime + n.t);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + n.t + n.d);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + n.t);
                osc.stop(audioCtx.currentTime + n.t + n.d);
            });
        }

        function playJumpSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playWoodSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playBuildSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playDamageSound() {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playHealSound() {
            initAudio();
            if (!audioCtx) return;
            let notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.06 + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + idx * 0.06);
                osc.stop(audioCtx.currentTime + idx * 0.06 + 0.12);
            });
        }

        let bgmTimer = 0;
        let bgmStep = 0;
        const melodyNotes = [
            587.33, 659.25, 587.33, 659.25, 392.00, 392.00,
            587.33, 659.25, 783.99, 659.25, 440.00, 440.00
        ];

        function updateBGM() {
            if (!timerRunning || gameClear || gameOver) return;
            bgmTimer++;
            if (bgmTimer >= 12) {
                bgmTimer = 0;
                let freq = melodyNotes[bgmStep % melodyNotes.length];
                playBgmNote(freq, (bgmStep % 6 >= 4) ? 0.15 : 0.08);
                bgmStep++;
            }
        }

        function playBgmNote(freq, duration) {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let woodCount = 0;
        let damProgress = 0;
        const maxDam = 100;
        let hp = 100;
        const maxHp = 100;
        let gameOver = false;
        let gameOverSoundPlayed = false;
        let gameClear = false;
        let invincibilityTimer = 0;
        let deliverTimer = 0;

        let startTime = 0;
        let elapsedTime = 0;
        let penaltyTime = 0;
        let timerRunning = false;
        let finalTimeString = "";
        let scoreRegistered = false;
        let clearModalTriggered = false;

        let clearTimer = 0;
        const maxClearTime = 360;

        let startTextTimer = 0;
        let showStartText = false;

        let fireworks = [];
        let crackers = [];
        let healEffects = [];
        let penaltyEffects = [];
        let buildSparkles = [];

        let carrots = [];
        let carrotSpawnTimer = 0;

        let clouds = [
            { x: 100, y: 50, speed: 0.2, scale: 1.0 },
            { x: 450, y: 80, speed: 0.15, scale: 1.3 },
            { x: 900, y: 40, speed: 0.25, scale: 0.8 },
            { x: 1400, y: 70, speed: 0.18, scale: 1.2 },
            { x: 1850, y: 50, speed: 0.22, scale: 0.9 },
        ];

        let stars = [];
        for(let i=0; i<45; i++) {
            stars.push({
                x: Math.random() * 2200,
                y: Math.random() * 180,
                size: 1 + Math.random() * 1.5,
                baseAlpha: 0.2 + Math.random() * 0.3,
                twinkleAmplitude: 0.1 + Math.random() * 0.15,
                twinkleSpeed: 0.005 + Math.random() * 0.01
            });
        }

        let beaver = {
            x: 100,
            y: 220,
            width: 75,
            height: 75,
            vx: 0,
            vy: 0,
            baseSpeed: 4.5,
            baseJumpForce: -11,
            gravity: 0.5,
            isGrounded: false,
            facing: 1,
            rotation: 0,
            walkTimer: 0,
            blinkTimer: 0,
            isBlinking: false
        };

        const damX = 1800;
        const worldWidth = 2200;

        let babyBeavers = [
            { x: 1880, y: 262, vy: 0, vx: 0.8, facing: 1, walkTimer: 0, blinkTimer: 10, isBlinking: false, cheerText: "わーい！" },

        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let min = Math.floor(totalSec / 60);
            let sec = totalSec % 60;
            let millis = Math.floor((ms % 1000) / 10);
            return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(millis).padStart(2, '0')}`;

        async function openRankingModal(showEntry = false) {
            let ranking = await getCloudRanking();
            updateRankingDisplay(ranking);
            
            document.getElementById("nameEntryArea").style.display = showEntry ? "block" : "none";
            
            let resMsg = document.getElementById("resultMessage");
            if (showEntry) {
                let totalScoreMs = elapsedTime + penaltyTime;
                let currentRank = ranking.filter(r => r.timeMs < totalScoreMs).length + 1;
                resMsg.innerHTML = `🎉 クリアタイム: <b>${finalTimeString}</b><br>いま登録すると <span style="font-size:20px; color:#ff3333;">【 ${currentRank}位 】</span> です！`;

            }

        async function saveScore() {
            let regBtn = document.getElementById("registerBtn");
            if (regBtn.disabled) return;

            let nameInput = document.getElementById("nameInput").value.trim();
            let playerName = nameInput !== "" ? nameInput : "名無しさん";
            let totalScoreMs = elapsedTime + penaltyTime;

            regBtn.disabled = true;
            regBtn.innerText = "登録中...";

            let safetyTimer = setTimeout(() => {
                if (regBtn.disabled) {
                    regBtn.disabled = false;
                    regBtn.innerText = "登録";
                    document.getElementById("nameEntryArea").style.display = "none";
                    document.getElementById("resultMessage").innerHTML = `✨ 登録完了！ (${playerName}さん)`;
                    document.getElementById("resultMessage").style.display = "block";
                }
            }, 3000);

            try {
                await saveCloudScore(playerName, totalScoreMs, finalTimeString);

                let ranking = await getCloudRanking();
                let userRank = ranking.filter(r => r.timeMs < totalScoreMs).length + 1;

                clearTimeout(safetyTimer);
                scoreRegistered = true;

                document.getElementById("nameEntryArea").style.display = "none";
                let resMsg = document.getElementById("resultMessage");
                resMsg.innerHTML = `✨ 登録完了！<br><b>${playerName}</b> さんは<br><span style="font-size:22px; color:#ff3333;">【 ${userRank}位 】</span> でした！`;
                resMsg.style.display = "block";
                document.getElementById("modalTitle").innerText = "🏆 順位結果";

                updateRankingDisplay(ranking);
            } catch (err) {
                clearTimeout(safetyTimer);
                regBtn.disabled = false;
                regBtn.innerText = "登録";
                console.error("保存失敗:", err);
                alert("通信エラーが発生しました。もう一度お試しください。");
            }
        }

        function drawSparkleStar(x, y, size, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = "#ffffaa";
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.quadraticCurveTo(0, 0, size, 0);
            ctx.quadraticCurveTo(0, 0, 0, size);
            ctx.quadraticCurveTo(0, 0, -size, 0);
            ctx.quadraticCurveTo(0, 0, 0, -size);
            ctx.fill();
            ctx.restore();
        }

        function drawLog(x, y) {

            ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);

            ctx.stroke();

            ctx.beginPath();

            ctx.restore();
        }

        function drawRock(rock) {
            ctx.save();
            ctx.translate(rock.x, rock.y);

            const outlineColor = "#2c3034";
            const baseColor = "#71797e";
            const highlightColor = "#939b9e";
            const shadowColor = "#4a4f52";

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = outlineColor;

            ctx.fillStyle = baseColor;
            ctx.beginPath();
            if (rock.type === 1) {
                ctx.moveTo(5, rock.height);
                ctx.lineTo(0, rock.height * 0.5);
                ctx.lineTo(12, rock.height * 0.1);
                ctx.lineTo(rock.width * 0.6, 0);
                ctx.lineTo(rock.width - 5, rock.height * 0.3);
                ctx.lineTo(rock.width, rock.height);
            } else if (rock.type === 2) {
                ctx.moveTo(8, rock.height);
                ctx.lineTo(2, rock.height * 0.6);
                ctx.lineTo(rock.width * 0.35, 3);
                ctx.lineTo(rock.width * 0.7, 0);
                ctx.lineTo(rock.width - 2, rock.height * 0.4);
                ctx.lineTo(rock.width - 6, rock.height);
            } else {
                ctx.moveTo(6, rock.height);
                ctx.lineTo(0, rock.height * 0.7);
                ctx.lineTo(15, rock.height * 0.25);
                ctx.lineTo(rock.width * 0.4, 0);
                ctx.lineTo(rock.width * 0.75, rock.height * 0.15);
                ctx.lineTo(rock.width, rock.height * 0.5);
                ctx.lineTo(rock.width - 4, rock.height);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = highlightColor;
            ctx.beginPath();
            if (rock.type === 1) {
                ctx.moveTo(15, rock.height * 0.2);
                ctx.lineTo(rock.width * 0.5, 8);
                ctx.lineTo(rock.width * 0.6, rock.height * 0.5);
                ctx.lineTo(15, rock.height * 0.6);
            } else if (rock.type === 2) {
                ctx.moveTo(rock.width * 0.35, 12);
                ctx.lineTo(rock.width * 0.65, 8);
                ctx.lineTo(rock.width * 0.7, rock.height * 0.5);
                ctx.lineTo(rock.width * 0.3, rock.height * 0.6);
            } else {
                ctx.moveTo(18, rock.height * 0.3);
                ctx.lineTo(rock.width * 0.4, 8);
                ctx.lineTo(rock.width * 0.7, rock.height * 0.35);
                ctx.lineTo(rock.width * 0.4, rock.height * 0.55);
            }
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = shadowColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (rock.type === 1) {
                ctx.moveTo(25, rock.height * 0.4); ctx.lineTo(rock.width * 0.7, rock.height * 0.8);
            } else if (rock.type === 2) {
                ctx.moveTo(rock.width * 0.4, rock.height * 0.4); ctx.lineTo(rock.width * 0.8, rock.height * 0.85);
            } else {
                ctx.moveTo(rock.width * 0.3, rock.height * 0.5); ctx.lineTo(rock.width * 0.65, rock.height * 0.9);
                ctx.moveTo(rock.width * 0.2, rock.height * 0.3); ctx.lineTo(rock.width * 0.1, rock.height * 0.7);
            }
            ctx.stroke();

            ctx.fillStyle = nightMode ? "#254220" : "#3b7a30";
            ctx.beginPath();
            ctx.ellipse(10, rock.height - 4, 7, 3.5, 0, 0, Math.PI * 2);
            ctx.ellipse(rock.width - 12, rock.height - 5, 9, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

            ctx.lineWidth = strokeWidth;

            ctx.ellipse(46, 62 + (hipSway < 0 ? -hipSway : 0), 7, 8, 0, 0, Math.PI * 2);

            ctx.stroke();

            ctx.stroke();

            ctx.beginPath();

            }

            ctx.fillStyle = "#f2c185";

                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.ellipse(18, 42, 5, 4, -0.3, 0, Math.PI * 2);

        function drawBeaver(beaver) {
            ctx.save();
            ctx.translate(beaver.x + beaver.width / 2, beaver.y + beaver.height / 2);
            ctx.rotate(beaver.rotation);
            ctx.translate(-beaver.width / 2, -beaver.height / 2);

            let isDamagedFlash = (invincibilityTimer > 0 && Math.floor(invincibilityTimer / 4) % 2 === 0);
            if (invincibilityTimer > 0 && !isDamagedFlash) {
                ctx.globalAlpha = 0.5;
            }

            const outlineColor = "#2b1303";
            const strokeWidth = 2.5;

            const bodyColor = isDamagedFlash ? "#ff2222" : "#a85311";
            const headColor = isDamagedFlash ? "#ff4444" : "#b55b14";
            const tailColor = isDamagedFlash ? "#cc1111" : "#5c3a21";
            const legColor = isDamagedFlash ? "#aa1111" : "#7a380a";
            const armColor = isDamagedFlash ? "#cc2222" : "#b55b14";

            let hipSway = 0;
            let tailWag = 0;
            if (beaver.isGrounded && beaver.vx !== 0) {
                hipSway = Math.sin(beaver.walkTimer) * 3;
                tailWag = Math.cos(beaver.walkTimer * 2) * 0.15;
            }

            ctx.save();
            ctx.translate(0, hipSway);
            let tailX = (beaver.facing === 1) ? 2 : 68;
            ctx.fillStyle = tailColor;
            ctx.beginPath();
            ctx.ellipse(tailX, 48 + (hipSway * 0.5), 33, 12, 0.2 + tailWag, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = strokeWidth;
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = legColor;
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = strokeWidth;

            ctx.beginPath();
            ctx.ellipse(24, 62 + (hipSway > 0 ? hipSway : 0), 7, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(46, 62 + (hipSway < 0 ? -hipSway : 0), 7, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.save();
            ctx.translate(0, hipSway);

            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.ellipse(35, 42, 20, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = isDamagedFlash ? "#ff7777" : "#d08542";
            ctx.beginPath();
            ctx.ellipse(35, 43, 12, 11, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = headColor;
            ctx.beginPath();
            ctx.arc(35, 22, 17, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = legColor;
            ctx.beginPath(); ctx.arc(21, 10, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(49, 10, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = "#1a0c04";
            if (gameOver) {
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(26, 16); ctx.lineTo(32, 22);
                ctx.moveTo(32, 16); ctx.lineTo(26, 22);
                ctx.moveTo(38, 16); ctx.lineTo(44, 22);
                ctx.moveTo(44, 16); ctx.lineTo(38, 22);
                ctx.stroke();
            } else if (gameClear) {
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(25, 20); ctx.lineTo(29, 15); ctx.lineTo(33, 20);
                ctx.moveTo(37, 20); ctx.lineTo(41, 15); ctx.lineTo(45, 20);
                ctx.stroke();
            } else if (beaver.isBlinking) {
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(26, 18); ctx.lineTo(32, 18);
                ctx.moveTo(38, 18); ctx.lineTo(44, 18);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(29, 18, 2.5, 0, Math.PI * 2);
                ctx.arc(41, 18, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = "#e8b070";
            ctx.beginPath();
            ctx.ellipse(35, 25, 9, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "#111";
            ctx.beginPath(); ctx.arc(35, 22, 2.5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#fff";
            ctx.fillRect(33, 27, 4, 6);
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 1;
            ctx.strokeRect(33, 27, 4, 6);

            ctx.strokeStyle = "#2b1303";
            ctx.lineWidth = 1.5;
            ctx.lineCap = "round";

            let leftWhiskers = [
                { startX: 27, startY: 23, cpX: 18, cpY: 24, endX: 10, endY: 28 },
                { startX: 26, startY: 25, cpX: 17, cpY: 27, endX: 9,  endY: 32 },
                { startX: 26, startY: 27, cpX: 17, cpY: 30, endX: 10, endY: 36 },
                { startX: 27, startY: 29, cpX: 18, cpY: 33, endX: 12, endY: 40 }
            ];
            leftWhiskers.forEach(w => {
                ctx.beginPath();
                ctx.moveTo(w.startX, w.startY);
                ctx.quadraticCurveTo(w.cpX, w.cpY, w.endX, w.endY);
                ctx.stroke();
            });

            let rightWhiskers = [
                { startX: 43, startY: 23, cpX: 52, cpY: 24, endX: 60, endY: 28 },
                { startX: 44, startY: 25, cpX: 53, cpY: 27, endX: 61, endY: 32 },
                { startX: 44, startY: 27, cpX: 53, cpY: 30, endX: 60, endY: 36 },
                { startX: 43, startY: 29, cpX: 52, cpY: 33, endX: 58, endY: 40 }
            ];
            rightWhiskers.forEach(w => {
                ctx.beginPath();
                ctx.moveTo(w.startX, w.startY);
                ctx.quadraticCurveTo(w.cpX, w.cpY, w.endX, w.endY);
                ctx.stroke();
            });

            if (gameClear) {
                ctx.fillStyle = armColor;
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = strokeWidth;

                ctx.beginPath();
                ctx.ellipse(15, 28, 5, 6, -0.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(55, 28, 5, 6, 0.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else if (woodCount === 0) {
                ctx.fillStyle = armColor;
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = strokeWidth;

                ctx.beginPath();
                ctx.ellipse(18, 42, 5, 4, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(52, 42, 5, 4, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            if (!gameClear && woodCount >= 1) {
                ctx.save();
                ctx.translate(14, 24);
                ctx.fillStyle = "#8B4513";
                ctx.beginPath();
                ctx.roundRect(0, 0, 42, 16, 5);
                ctx.fill();
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#e3b782";
                ctx.beginPath();
                ctx.ellipse(42, 8, 4, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = armColor;
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = strokeWidth;

                ctx.beginPath();
                ctx.ellipse(22, 43, 5, 6, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(46, 36, 5, 6, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } 
            
            if (!gameClear && woodCount >= 2) {
                let stackCount = Math.min(3, woodCount - 1); 
                for (let i = 0; i < stackCount; i++) {
                    let boxY = -6 - (i * 12); 
                    ctx.save();
                    ctx.translate(17, boxY);
                    ctx.fillStyle = "#8B4513";
                    ctx.beginPath();
                    ctx.roundRect(0, 0, 36, 11, 4);
                    ctx.fill();
                    ctx.strokeStyle = outlineColor;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.fillStyle = "#e3b782";
                    ctx.beginPath();
                    ctx.ellipse(36, 5.5, 3, 5.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }

            ctx.restore();
            ctx.restore();
        }

        function drawHedgehog(enemy) {
            ctx.save();
            ctx.translate(enemy.x, enemy.y);

            if (enemy.dir === -1) {
                ctx.translate(44, 0);
                ctx.scale(-1, 1);
            }

            let legOffset1 = Math.sin(enemy.walkTimer) * 2;

            ctx.fillStyle = "#5c3a21";
            ctx.strokeStyle = "#2b1303";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(10 + legOffset1, 23, 3, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(26 - legOffset1, 23, 3, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#8c6239";
            ctx.beginPath();
            ctx.ellipse(-2, 15, 5, 2.5, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#3b2817";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = "#4a3b32";
            ctx.beginPath();
            ctx.moveTo(-4, 12);
            ctx.lineTo(-8, 3);
            ctx.lineTo(1, 10);
            ctx.fill();

            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(2 + i * 6, 10);
                ctx.lineTo(5 + i * 6, -5);
                ctx.lineTo(9 + i * 6, 10);
                ctx.fill();
            }

            ctx.fillStyle = "#8c6239";
            ctx.beginPath();
            ctx.ellipse(20, 14, 18, 11, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#3b2817";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#d4a373";
            ctx.beginPath();
            ctx.arc(32, 13, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#111";
            if (enemy.isBlinking) {
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(32.5, 10.5); ctx.lineTo(35.5, 10.5);
                ctx.moveTo(36.5, 13.5); ctx.lineTo(39.5, 13.5);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(34, 11, 1.5, 0, Math.PI * 2);
                ctx.arc(38, 14, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function spawnFirework() {
            let fx = Math.random() * canvas.width;
            let fy = 50 + Math.random() * 150;
            let colors = ["#ff3333", "#ffff33", "#33ffff", "#ff33ff", "#33ff33", "#ff9900"];
            let chosenColor = colors[Math.floor(Math.random() * colors.length)];
            
            let particleCount = 35;
            for (let i = 0; i < particleCount; i++) {
                let angle = (Math.PI * 2 / particleCount) * i;
                let speed = 2 + Math.random() * 4;
                fireworks.push({
                    x: fx,
                    y: fy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: chosenColor,
                    alpha: 1.0,
                    life: 50 + Math.random() * 30
                });
            }
        }

        function spawnCrackerBurst() {
            let cx = Math.random() * canvas.width;
            let cy = canvas.height - 20;
            let colors = ["#ff3366", "#33ccff", "#ffcc00", "#66ff66", "#cc66ff", "#ffffff"];

            for (let i = 0; i < 20; i++) {
                crackers.push({
                    x: cx,
                    y: cy,
                    vx: (Math.random() - 0.5) * 10,
                    vy: -7 - Math.random() * 8,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: 8 + Math.random() * 6,
                    rotation: Math.random() * Math.PI,
                    vRot: (Math.random() - 0.5) * 0.3,
                    gravity: 0.25,
                    life: 80
                });
            }
        }

        function spawnRandomCarrot() {
            if (carrots.length >= 2) return;
            let rx = 250 + Math.random() * (damX - 350);
            let ry = (Math.random() < 0.6) ? 272 : (190 + Math.random() * 40);
            carrots.push({
                x: rx,
                y: ry,
                width: 32,
                height: 20,
                timer: 0,
                life: 600
            });
        }

        function updateBabyBeavers() {
            let maxBlocks = 10;
            let currentBlocks = Math.floor((damProgress / 100) * maxBlocks);
            let blockHeight = 10;
            let totalWoodHeight = currentBlocks * blockHeight;
            let waterOffset = (damProgress > 0) ? 6 : 0;
            let currentWaterHeight = Math.max(0, totalWoodHeight - waterOffset);
            let targetBaseY = (currentWaterHeight > 10) ? (300 - currentWaterHeight - 25) : 262;

            babyBeavers.forEach((baby, index) => {
                baby.blinkTimer++;
                if (!baby.isBlinking && baby.blinkTimer > 100 + index * 30) {
                    baby.isBlinking = true;
                    baby.blinkTimer = 0;
                } else if (baby.isBlinking && baby.blinkTimer > 12) {
                    baby.isBlinking = false;
                    baby.blinkTimer = 0;
                }

                if (gameClear) {
                    baby.x += baby.vx * 1.8;
                    if (baby.x < damX + 55) { baby.x = damX + 55; baby.vx = Math.abs(baby.vx); baby.facing = 1; }
                    if (baby.x > worldWidth - 65) { baby.x = worldWidth - 65; baby.vx = -Math.abs(baby.vx); baby.facing = -1; }

                    baby.vy += 0.45;
                    baby.y += baby.vy;
                    baby.walkTimer += 0.35;

                    if (baby.y >= targetBaseY) {
                        baby.y = targetBaseY;
                        baby.vy = -7.5 - (index % 2) * 2.0; 
                    }
                } else {
                    baby.x += baby.vx;
                    baby.walkTimer += 0.15;

                    if (baby.x < damX + 55) {
                        baby.x = damX + 55;
                        baby.vx = Math.abs(baby.vx);
                        baby.facing = 1;
                    } else if (baby.x > worldWidth - 65) {
                        baby.x = worldWidth - 65;
                        baby.vx = -Math.abs(baby.vx);
                        baby.facing = -1;
                    } else if (Math.random() < 0.01) {
                        baby.vx *= -1;
                        baby.facing = (baby.vx > 0) ? 1 : -1;
                    }

                    let bobbing = (currentWaterHeight > 10) ? Math.sin(Date.now() * 0.005 + index) * 2 : 0;
                    baby.y += ((targetBaseY + bobbing) - baby.y) * 0.15;
                }
            });
        }

        function update() {
            if (nightModeMsgTimer > 0) nightModeMsgTimer--;

            if (gameOver) {
                if (!gameOverSoundPlayed) {
                    gameOverSoundPlayed = true;
                    playGameOverSound();
                }
                return;
            }

            updateBGM();
            updateBabyBeavers();

            if (gameClear) {
                beaver.vy += 0.45;
                beaver.y += beaver.vy;
                beaver.walkTimer += 0.35;
                if (beaver.y >= 225) {
                    beaver.y = 225;
                    beaver.vy = -8.0;
                }
                beaver.rotation *= 0.8;

                if (clearTimer === 0) {
                    timerRunning = false;
                    finalTimeString = formatTime(elapsedTime + penaltyTime);
                    
                    playVictoryFanfare();
                    
                    if (!scoreRegistered && !clearModalTriggered) {
                        clearModalTriggered = true;
                        setTimeout(() => {
                            openRankingModal(true);
                        }, 900);
                    }
                }

                if (clearTimer < maxClearTime) {
                    clearTimer++;
                    if (Math.random() < 0.12) spawnFirework();
                    if (Math.random() < 0.18) spawnCrackerBurst();
                }

                fireworks.forEach(fw => {
                    fw.x += fw.vx;
                    fw.y += fw.vy;
                    fw.vy += 0.05;
                    fw.alpha -= 1 / fw.life;
                });
                fireworks = fireworks.filter(fw => fw.alpha > 0);

                crackers.forEach(c => {
                    c.x += c.vx;
                    c.y += c.vy;
                    c.vy += c.gravity;
                    c.rotation += c.vRot;
                    c.life--;
                });
                crackers = crackers.filter(c => c.life > 0);

                return;
            }

            if (Math.random() < 0.35) {
                buildSparkles.push({
                    x: damX - 10 + Math.random() * 60,
                    y: 295 - Math.random() * 40,
                    vy: -0.6 - Math.random() * 1.2,
                    size: 4 + Math.random() * 5,
                    alpha: 1.0,
                    life: 40 + Math.random() * 30
                });
            }
            buildSparkles.forEach(sp => {
                sp.y += sp.vy;
                sp.alpha -= 1 / sp.life;
            });
            buildSparkles = buildSparkles.filter(sp => sp.alpha > 0);

            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x < -100) {
                    cloud.x = worldWidth + 100;
                }
            });

            beaver.blinkTimer++;
            if (!beaver.isBlinking && beaver.blinkTimer > 120 + Math.random() * 180) {
                beaver.isBlinking = true;
                beaver.blinkTimer = 0;
            } else if (beaver.isBlinking && beaver.blinkTimer > 12) {
                beaver.isBlinking = false;
                beaver.blinkTimer = 0;
            }

            if (!timerRunning && !gameClear && (keys["ArrowLeft"] || keys["ArrowRight"] || keys["Space"] || keys["KeyA"] || keys["KeyD"])) {
                timerRunning = true;
                startTime = Date.now();
                showStartText = true;
                startTextTimer = 0;
                playStartSound();
            }

            if (showStartText) {
                startTextTimer++;
                if (startTextTimer > 75) {
                    showStartText = false;
                }
            }

            if (timerRunning && !gameClear) {
                elapsedTime = Date.now() - startTime;
            }

            if (invincibilityTimer > 0) { invincibilityTimer--; }

            carrotSpawnTimer++;
            if (carrotSpawnTimer >= 300) {
                carrotSpawnTimer = 0;
                if (Math.random() < 0.75) {
                    spawnRandomCarrot();
                }
            }

            carrots.forEach(c => {
                c.timer++;
                if (beaver.x < c.x + c.width && beaver.x + beaver.width > c.x &&
                    beaver.y < c.y + c.height && beaver.y + beaver.height > c.y) {
                    let healed = Math.min(maxHp - hp, 30);
                    hp = Math.min(maxHp, hp + 30);
                    c.collected = true;
                    playHealSound();
                    healEffects.push({
                        x: beaver.x + 10,
                        y: beaver.y - 15,
                        text: healed > 0 ? `+${healed} HP!` : "MAX HP!",
                        alpha: 1.0
                    });
                }
            });
            carrots = carrots.filter(c => !c.collected && c.timer < c.life);

            healEffects.forEach(he => {
                he.y -= 1.2;
                he.alpha -= 0.02;
            });
            healEffects = healEffects.filter(he => he.alpha > 0);

            penaltyEffects.forEach(pe => {
                pe.y -= 1.2;
                pe.alpha -= 0.02;
            });
            penaltyEffects = penaltyEffects.filter(pe => pe.alpha > 0);

            let weightFactor = 1.0 - (woodCount * 0.12); 
            let currentSpeed = beaver.baseSpeed * weightFactor;
            let currentJumpForce = beaver.baseJumpForce * (1.0 - (woodCount * 0.04));

            if (keys["ArrowLeft"] || keys["KeyA"]) {
                beaver.vx = -currentSpeed; beaver.facing = -1;
            } else if (keys["ArrowRight"] || keys["KeyD"]) {
                beaver.vx = currentSpeed; beaver.facing = 1;
            } else { beaver.vx = 0; }

            if (beaver.isGrounded && beaver.vx !== 0) {
                beaver.walkTimer += 0.25;
            } else {
                beaver.walkTimer = 0;
            }

            if ((keys["ArrowUp"] || keys["Space"] || keys["KeyW"]) && beaver.isGrounded) {
                beaver.vy = currentJumpForce; 
                beaver.isGrounded = false;
                playJumpSound();
            }

            beaver.vy += beaver.gravity;
            
            if (!beaver.isGrounded) {
                beaver.rotation += 0.15 * beaver.facing;
            } else {
                beaver.rotation = 0;
            }

            beaver.x += beaver.vx;
            let blockWidth = 40;
            let maxBlocks = 10;
            let currentBlocks = Math.floor((damProgress / 100) * maxBlocks);
            let blockHeight = 10;
            
            if (currentBlocks > 0) {
                let damTopY = 300 - (currentBlocks * blockHeight);
                if (beaver.y + beaver.height > damTopY && beaver.x + beaver.width > damX && beaver.x < damX + blockWidth) {
                    if (beaver.vx > 0) {
                        beaver.x = damX - beaver.width;
                    } else if (beaver.vx < 0) {
                        beaver.x = damX + blockWidth;
                    }
                }
            }

            beaver.y += beaver.vy;

            const groundY = 300;
            beaver.isGrounded = false;

            if (beaver.y + beaver.height > groundY) {
                beaver.y = groundY - beaver.height;
                beaver.vy = 0;
                beaver.isGrounded = true;
            }

            rocks.forEach(rock => {
                if (beaver.vy >= 0 &&
                    beaver.x + beaver.width > rock.x + 8 && beaver.x < rock.x + rock.width - 8 &&
                    beaver.y + beaver.height >= rock.y && beaver.y + beaver.height <= rock.y + 18) {
                    beaver.y = rock.y - beaver.height;
                    beaver.vy = 0;
                    beaver.isGrounded = true;
                }
            });

            if (currentBlocks > 0) {
                let damTopY = 300 - (currentBlocks * blockHeight);
                if (beaver.vy >= 0 &&
                    beaver.x + beaver.width > damX && beaver.x < damX + blockWidth &&
                    beaver.y + beaver.height >= damTopY && beaver.y + beaver.height <= damTopY + 16) {
                    beaver.y = damTopY - beaver.height;
                    beaver.vy = 0;
                    beaver.isGrounded = true;
                }
            }

            if (beaver.x < 0) beaver.x = 0;
            if (beaver.x > worldWidth - beaver.width) beaver.x = worldWidth - beaver.width;

            cameraX = beaver.x - 250;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

            let remainingNeeded = Math.round((maxDam - damProgress) / 10);
            let maxCarryable = Math.min(4, remainingNeeded);

            woods.forEach(wood => {
                if (wood.collected) {
                    wood.respawnTimer++;
                    if (wood.respawnTimer > 250) {
                        wood.collected = false; wood.respawnTimer = 0;
                    }
                } else {
                    if (woodCount < maxCarryable &&
                        beaver.x < wood.x + 40 && beaver.x + beaver.width > wood.x &&
                        beaver.y < wood.y + 22 && beaver.y + beaver.height > wood.y) {
                        wood.collected = true; 
                        woodCount += 1;
                        playWoodSound();
                    }
                }
            });

            if (woodCount > 0 && beaver.x < damX + blockWidth && beaver.x + beaver.width > damX) {
                deliverTimer++;
                if (deliverTimer >= 18) { 
                    damProgress = Math.min(maxDam, damProgress + 10);
                    woodCount -= 1;
                    deliverTimer = 0;
                    playBuildSound();
                    for(let k=0; k<10; k++) {
                        buildSparkles.push({
                            x: damX - 10 + Math.random() * 60,
                            y: 280 - Math.random() * 60,
                            vy: -1.5 - Math.random() * 2.0,
                            size: 6 + Math.random() * 6,
                            alpha: 1.0,
                            life: 40
                        });
                    }
                    if (damProgress >= maxDam) {
                        gameClear = true;
                        for (let i = 0; i < 8; i++) spawnFirework();
                        for (let i = 0; i < 6; i++) spawnCrackerBurst();
                    }
                }
            } else {
                deliverTimer = 0;
            }

            enemies.forEach(enemy => {
                enemy.x += enemy.speed * enemy.dir;
                enemy.walkTimer += 0.2;
                
                if (enemy.x < 300 || enemy.x > damX - enemy.width || Math.random() < 0.008) {
                    enemy.dir *= -1;
                    if (enemy.x > damX - enemy.width) {
                        enemy.x = damX - enemy.width;
                    } else if (enemy.x < 300) {
                        enemy.x = 300;
                    }
                }

                enemy.blinkTimer++;
                if (!enemy.isBlinking && enemy.blinkTimer > 100 + Math.random() * 150) {
                    enemy.isBlinking = true;
                    enemy.blinkTimer = 0;
                } else if (enemy.isBlinking && enemy.blinkTimer > 10) {
                    enemy.isBlinking = false;
                    enemy.blinkTimer = 0;
                }

                let margin = 6;
                if (invincibilityTimer === 0 &&
                    beaver.x + margin < enemy.x + enemy.width && beaver.x + beaver.width - margin > enemy.x &&
                    beaver.y + margin < enemy.y + enemy.height && beaver.y + beaver.height - margin > enemy.y) {
                    hp -= 20;
                    invincibilityTimer = 60;
                    penaltyTime += 5000;
                    playDamageSound();

                    penaltyEffects.push({
                        x: beaver.x + 10,
                        y: beaver.y - 15,
                        text: "+5s PENALTY!",
                        alpha: 1.0
                    });
                    if (hp <= 0) gameOver = true;
                }
            });
        }

        function drawStatusBar(x, y, width, height, current, max, label, fillColor) {
            ctx.save();
            ctx.fillStyle = nightMode ? "#fff" : "#000";
            ctx.font = "bold 13px 'M PLUS Rounded 1c', sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(label, x, y - 4);

            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.strokeStyle = nightMode ? "#fff" : "#000";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 5);
            ctx.fill();
            ctx.stroke();

            let ratio = Math.max(0, Math.min(1, current / max));
            if (ratio > 0) {
                ctx.fillStyle = fillColor;
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, (width - 4) * ratio, height - 4, 3);
                ctx.fill();
            }
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // ==========================================
            // 1. 固定背景（星空と月、および独立した背景要素）
            // ==========================================
            if (nightMode) {
                ctx.fillStyle = "#0c1428";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 星（画面固定またはカメラ非連動で美しく輝かせる）
                stars.forEach(s => {
                    let alpha = s.baseAlpha + Math.sin(Date.now() * s.twinkleSpeed) * s.twinkleAmplitude;
                    ctx.globalAlpha = Math.max(0.1, Math.min(0.6, alpha));
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(s.x % canvas.width, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;

                // お月様（画面右上の固定位置に美しく配置）
                let moonX = canvas.width - 150;
                let moonY = 75;
                let moonRadius = 26;

                ctx.save();
                ctx.fillStyle = "rgba(255, 250, 237, 0.9)";
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
                ctx.fill();

                // 月の中のビーバー親子シルエット（特徴の「平べったい尻尾」付き）
                ctx.fillStyle = "rgba(150, 130, 100, 0.65)";
                
                // 左の子どもビーバー（本体＋耳＋特徴的な平たい尻尾）
                ctx.beginPath();
                ctx.arc(moonX - 7, moonY - 1, 6.5, 0, Math.PI * 2);
                ctx.arc(moonX - 10, moonY - 8, 3.5, 0, Math.PI * 2); // 耳
                ctx.fill();
                // 左の子の尻尾（横に広がった楕円）
                ctx.beginPath();
                ctx.ellipse(moonX - 15, moonY + 1, 5, 2.5, 0.2, 0, Math.PI * 2);
                ctx.fill();

                // 右の子どもビーバー（本体＋耳＋特徴的な平たい尻尾）
                ctx.beginPath();
                ctx.arc(moonX + 7, moonY + 5, 5.5, 0, Math.PI * 2);
                ctx.arc(moonX + 9, moonY - 1, 3, 0, Math.PI * 2); // 耳
                ctx.fill();
                // 右の子の尻尾
                ctx.beginPath();
                ctx.ellipse(moonX + 14, moonY + 7, 4.5, 2, -0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            } else {
                ctx.fillStyle = "#87CEEB";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // ==========================================
            // 2. カメラ連動レイヤー（雲、地形、オブジェクト、キャラクター）
            // ==========================================
            ctx.save();
            ctx.translate(-cameraX, 0);

            // 雲（月や星よりも確実に手前で、プレイヤーのカメラ移動に合わせて流れます）
            clouds.forEach(cloud => {
                let renderX = cloud.x - (cameraX * 0.3);
                if (renderX < cameraX - 100) renderX += worldWidth + 200;
                drawCloud(renderX, cloud.y, cloud.scale);
            });

            ctx.fillStyle = nightMode ? "#1e382b" : "#4a8563";
            ctx.beginPath();
            ctx.moveTo(cameraX, 300);
            for (let i = 0; i <= worldWidth; i += 200) {
                ctx.lineTo(i, 180 + Math.sin(i * 0.005) * 50);
            }
            ctx.lineTo(cameraX + canvas.width, 300);
            ctx.fill();

            ctx.fillStyle = nightMode ? "#16281e" : "#2d5a3f";
            ctx.beginPath();
            ctx.moveTo(cameraX, 300);
            for (let i = 0; i <= worldWidth; i += 120) {
                ctx.lineTo(i, 220 + Math.cos(i * 0.01) * 35);
            }
            ctx.lineTo(cameraX + canvas.width, 300);
            ctx.fill();

            ctx.fillStyle = nightMode ? "#332211" : "#5c4033";
            ctx.fillRect(0, 300, worldWidth, 100);
            ctx.fillStyle = nightMode ? "#1b4d1b" : "#228B22";
            ctx.fillRect(0, 300, worldWidth, 15);

            rocks.forEach(rock => {
                drawRock(rock);
            });

            woods.forEach(wood => {
                if (!wood.collected) {
                    drawLog(wood.x, wood.y);
                }
            });

            carrots.forEach(c => {
                if (c.timer > c.life - 90 && Math.floor(c.timer / 6) % 2 === 0) return;
                let bobOffset = Math.sin(c.timer * 0.1) * 3;
                drawCarrot(c.x, c.y, bobOffset);
            });

            enemies.forEach(enemy => {
                drawHedgehog(enemy);
            });

            let blockWidth = 40;

            let pulse = 0.25 + Math.sin(Date.now() * 0.005) * 0.12;
            let beamGrad = ctx.createLinearGradient(0, 150, 0, 300);
            beamGrad.addColorStop(0, "rgba(255, 240, 100, 0)");
            beamGrad.addColorStop(1, `rgba(255, 240, 100, ${pulse})`);
            ctx.fillStyle = beamGrad;
            ctx.fillRect(damX - 10, 150, blockWidth + 20, 150);

            if (!gameClear) {
                ctx.save();
                ctx.font = "bold 15px 'M PLUS Rounded 1c', sans-serif";
                ctx.textAlign = "center";
                ctx.fillStyle = "#ffff66";
                ctx.strokeStyle = "#331a00";
                ctx.lineWidth = 3.5;
                let textX = damX + blockWidth / 2;
                let textY = 175 + Math.sin(Date.now() * 0.006) * 3;
                ctx.strokeText("↓ ここにお家を作ろう！！", textX, textY);
                ctx.fillText("↓ ここにお家を作ろう！！", textX, textY);
                ctx.restore();
            }

            let maxBlocks = 10;
            let currentBlocks = Math.floor((damProgress / 100) * maxBlocks);
            let blockHeight = 10; 

            let totalWoodHeight = currentBlocks * blockHeight;
            let waterOffset = (damProgress > 0) ? 6 : 0;
            let currentWaterHeight = Math.max(0, totalWoodHeight - waterOffset);
            let waterY = 300 - currentWaterHeight;

            for (let i = 0; i < currentBlocks; i++) {
                let bx = damX;
                let by = 300 - ((i + 1) * blockHeight);
                
                ctx.fillStyle = "#8B4513";
                ctx.fillRect(bx, by, blockWidth, blockHeight);
                ctx.strokeStyle = "#3d1c02";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(bx, by, blockWidth, blockHeight);

                ctx.fillStyle = "#e3b782";
                ctx.beginPath();
                ctx.ellipse(bx + blockWidth, by + blockHeight / 2, 2, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            buildSparkles.forEach(sp => {
                drawSparkleStar(sp.x, sp.y, sp.size, sp.alpha);
            });

            babyBeavers.forEach(baby => {
                drawBabyBeaver(baby);
            });

            if (currentWaterHeight > 0) {
                ctx.fillStyle = nightMode ? "rgba(10, 80, 160, 0.6)" : "rgba(30, 144, 255, 0.5)";
                let waterStartX = damX + blockWidth;
                let waterWidth = worldWidth - waterStartX; 
                
                ctx.fillRect(waterStartX, waterY, waterWidth, currentWaterHeight);
                
                ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(waterStartX, waterY);
                ctx.lineTo(waterStartX + waterWidth, waterY);
                ctx.stroke();
            }

            drawBeaver(beaver);

            healEffects.forEach(he => {
                ctx.save();
                ctx.globalAlpha = he.alpha;
                ctx.font = "bold 24px 'M PLUS Rounded 1c', sans-serif";
                ctx.textAlign = "center";
                ctx.fillStyle = "#33ff66";
                ctx.strokeStyle = "#003300";
                ctx.lineWidth = 5;
                ctx.strokeText(he.text, he.x, he.y);
                ctx.fillText(he.text, he.x, he.y);
                ctx.restore();
            });

            penaltyEffects.forEach(pe => {
                ctx.save();
                ctx.globalAlpha = pe.alpha;
                ctx.font = "bold 24px 'M PLUS Rounded 1c', sans-serif";
                ctx.textAlign = "center";
                ctx.fillStyle = "#ffcc00";
                ctx.strokeStyle = "#cc0000";
                ctx.lineWidth = 5;
                ctx.strokeText(pe.text, pe.x, pe.y);
                ctx.fillText(pe.text, pe.x, pe.y);
                ctx.restore();
            });

            ctx.restore();

            if (gameClear) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            fireworks.forEach(fw => {
                ctx.save();
                ctx.globalAlpha = fw.alpha;
                ctx.fillStyle = fw.color;
                ctx.beginPath();
                ctx.arc(fw.x, fw.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            crackers.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.rotation);
                ctx.fillStyle = c.color;
                ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
                ctx.restore();
            });

            drawStatusBar(20, 18, 110, 14, hp, maxHp, "HP", "#ff3344");
            drawStatusBar(20, 48, 110, 14, damProgress, maxDam, "お家完成度", "#33cc44");

            ctx.save();
            ctx.font = "bold 10px 'M PLUS Rounded 1c', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = nightMode ? "#ffffff" : "#000000";
            ctx.fillText(damProgress + "%", 20 + 55, 48 + 7);
            ctx.restore();

            let remainingNeeded = Math.round((maxDam - damProgress) / 10);
            let maxCarryable = Math.min(4, remainingNeeded);

            ctx.fillStyle = nightMode ? "#fff" : "#000";
            ctx.font = "bold 13px 'M PLUS Rounded 1c', sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("所持木材: " + woodCount + " / " + maxCarryable, 145, 60);
            
            let displayTime = timerRunning ? (elapsedTime + penaltyTime) : (gameClear ? (elapsedTime + penaltyTime) : 0);
            ctx.save();
            ctx.textAlign = "center";
            ctx.font = "bold 28px 'M PLUS Rounded 1c', sans-serif";
            ctx.fillStyle = "#ffff33";
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 5;
            ctx.strokeText("TIME: " + formatTime(displayTime), canvas.width / 2, 36);
            ctx.fillText("TIME: " + formatTime(displayTime), canvas.width / 2, 36);
            ctx.restore();

            if (nightModeMsgTimer > 0) {
                ctx.save();
                ctx.textAlign = "center";
                ctx.font = "bold 24px 'M PLUS Rounded 1c', sans-serif";
                ctx.fillStyle = "#00ffff";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 4;
                let modeText = nightMode ? "🌙 夜景モード ON！ 🌙" : "☀️ 昼モードに戻りました ☀️";
                ctx.strokeText(modeText, canvas.width / 2, 90);
                ctx.fillText(modeText, canvas.width / 2, 90);
                ctx.restore();
            }

            if (showStartText) {
                ctx.save();
                ctx.font = "bold 38px 'M PLUS Rounded 1c', sans-serif";
                ctx.textAlign = "center";
                ctx.fillStyle = "#ffcc00";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 6;
                ctx.strokeText("✨ スタート！！ ✨", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText("✨ スタート！！ ✨", canvas.width / 2, canvas.height / 2 - 20);
                ctx.restore();
            }

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.save();
                ctx.textAlign = "center";
                ctx.fillStyle = "#ff4444";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 6;
                ctx.font = "bold 40px 'M PLUS Rounded 1c', sans-serif";
                ctx.strokeText("GAME OVER", canvas.width / 2, 205);
                ctx.fillText("GAME OVER", canvas.width / 2, 205);
                ctx.restore();

            } else if (gameClear) {
                ctx.save();
                ctx.textAlign = "center";

                ctx.fillStyle = "#44ff44";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 6;
                ctx.font = "bold 36px 'M PLUS Rounded 1c', sans-serif";
                ctx.strokeText("🎉 CLEAR! " + finalTimeString + " 🎉", canvas.width / 2, 175);
                ctx.fillText("🎉 CLEAR! " + finalTimeString + " 🎉", canvas.width / 2, 175);

                ctx.fillStyle = "#ffff44";
                ctx.font = "bold 17px 'M PLUS Rounded 1c', sans-serif";
                ctx.strokeText("おめでとう！下のボタンからランキングを確認してね", canvas.width / 2, 215);
                ctx.fillText("おめでとう！下のボタンからランキングを確認してね", canvas.width / 2, 215);

                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
